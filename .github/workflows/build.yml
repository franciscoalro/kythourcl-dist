name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Plugins
        run: ./gradlew makePlugins --stacktrace
      - name: Copy cs3 and plugins.json to builds
        run: |
          mkdir -p builds
          find . -maxdepth 3 -name "*.cs3" -exec cp {} builds/ \;
          if [ -f build/plugins.json ]; then cp build/plugins.json builds/plugins.json; fi
          ls -lh builds/
      - name: Commit builds
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add builds/
          if ! git diff --staged --quiet; then
            git commit -m "build plugins [skip ci]"
            # Never rebase artifacts onto sources they were not built from.
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "main advanced during build; newer workflow will publish artifacts"
              exit 0
            fi
            # Non-forced push also guards a race after the SHA check.
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
