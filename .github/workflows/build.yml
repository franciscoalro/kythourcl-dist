name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Plugins
        run: ./gradlew :RedeCanaisAF:make :AnimeFire:make :CineVision:make :Pobreflix:make :TopAnimes:make --stacktrace
      - name: Copy cs3 to builds
        run: |
          mkdir -p builds
          find . -name "*.cs3" -exec cp {} builds/ \;
          ls -lh builds/
      - name: Commit builds
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add builds/
          if ! git diff --staged --quiet; then
            git commit -m "build plugins [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
