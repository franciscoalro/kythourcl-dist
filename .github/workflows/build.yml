name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Plugins
        run: ./gradlew makePlugins --stacktrace
      - name: Copy cs3 and plugins.json to builds
        run: |
          mkdir -p builds
          find . -maxdepth 3 -name "*.cs3" -exec cp {} builds/ \;
          if [ -f build/plugins.json ]; then cp build/plugins.json builds/plugins.json; fi
          ls -lh builds/
      - name: Commit builds
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add builds/
          if ! git diff --staged --quiet; then
            git commit -m "build plugins [skip ci]"
            # A newer source commit may land while this run is building. Rebase the
            # generated artifact commit instead of failing with a non-fast-forward.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another run (attempt $attempt); retrying..."
              sleep $((attempt * 2))
            done
            echo "Failed to publish generated artifacts after 3 attempts" >&2
            exit 1
          else
            echo "No changes to commit"
          fi
